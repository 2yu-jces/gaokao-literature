<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f2e7">

  <title>高考文学素材</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    body{
      margin:0;
      background:#f7f2e7;
      color:#303730;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",
      "Microsoft YaHei",sans-serif;
    }

    .app{
      max-width:720px;
      margin:auto;
      padding:22px 18px 80px;
    }

    h1{
      font-size:25px;
      margin:8px 0 5px;
    }

    .sub{
      color:#777;
      font-size:14px;
      margin-bottom:22px;
    }

    .tabs{
      display:flex;
      gap:8px;
      margin-bottom:18px;
    }

    button{
      border:0;
      border-radius:12px;
      padding:10px 15px;
      background:#e9e2d4;
      color:#303730;
      font-size:14px;
    }

    button.active{
      background:#303730;
      color:white;
    }

    .card{
      background:white;
      border-radius:18px;
      padding:20px;
      box-shadow:0 3px 14px rgba(0,0,0,.06);
      margin-bottom:15px;
    }

    .date{
      font-size:13px;
      color:#999;
      margin-bottom:15px;
    }

    .quote{
      font-family:serif;
      font-size:24px;
      line-height:1.55;
      margin-bottom:12px;
    }

    .author{
      text-align:right;
      color:#777;
      margin-bottom:20px;
    }

    h2{
      font-size:16px;
      margin-top:20px;
    }

    p{
      line-height:1.85;
    }

    .fav{
      float:right;
      cursor:pointer;
      font-size:22px;
    }

    .status{
      text-align:center;
      color:#999;
      font-size:12px;
      margin-top:20px;
    }

    input{
      width:100%;
      box-sizing:border-box;
      padding:13px;
      border-radius:12px;
      border:1px solid #ddd;
      font-size:16px;
      margin-bottom:15px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>高考文学素材</h1>
  <div class="sub">每日一页 · 真正可用于议论文</div>

  <div class="tabs">
    <button id="todayBtn" class="active">今日</button>
    <button id="historyBtn">历史</button>
    <button id="favBtn">收藏</button>
    <button id="searchBtn">搜索</button>
  </div>

  <div id="content"></div>

  <div class="status" id="status">正在读取素材库…</div>

</div>

<script>

let DATA = [];
let mode = "today";

let favorites =
  JSON.parse(localStorage.getItem("favorites") || "[]");


/* ===== 北京时间 ===== */

function beijingNow(){

  const now = new Date();

  const parts =
    new Intl.DateTimeFormat(
      "zh-CN",
      {
        timeZone:"Asia/Shanghai",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        hourCycle:"h23"
      }
    ).formatToParts(now);

  const obj = {};

  parts.forEach(p=>{
    obj[p.type]=p.value;
  });

  return {
    date:
      obj.year+"-"+obj.month+"-"+obj.day,
    hour:Number(obj.hour),
    minute:Number(obj.minute)
  };
}


/* ===== 判断是否解锁 ===== */
function unlocked(item){

  const now = beijingNow();

  // 第一天 2026-10-03 立即开放
  if(item.date === "2026-10-03")
    return true;

  // 以前日期全部开放
  if(item.date < now.date)
    return true;

  // 未来日期锁定
  if(item.date > now.date)
    return false;

  // 当天北京时间 22:00 后开放
  return now.hour >= 22;
}


/* ===== 当前已经解锁的素材 ===== */

function availableData(){

  return DATA.filter(unlocked);

}


/* ===== HTML 安全处理 ===== */

function esc(s){

  return String(s || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}


/* ===== 素材卡片 ===== */

function card(d){

  const loved = favorites.includes(d.date);

  return `
    <div class="card">

      <span class="fav"
        onclick="toggleFavorite('${d.date}')">
        ${loved ? "★" : "☆"}
      </span>

      <div class="date">${esc(d.date)}</div>

      <div class="quote">
        “${esc(d.quote)}”
      </div>

      <div class="author">
        —— ${esc(d.author)}《${esc(d.source)}》
      </div>

      <h2>人物 / 名著素材</h2>
      <p>${esc(d.material)}</p>

      <h2>核心论点</h2>
      <p>${esc(d.argument)}</p>

      <h2>议论文运用示例</h2>
      <p>${esc(d.example)}</p>

    </div>
  `;
}


/* ===== 收藏 ===== */

function toggleFavorite(date){

  if(favorites.includes(date)){

    favorites =
      favorites.filter(x=>x!==date);

  }else{

    favorites.push(date);

  }

  localStorage.setItem(
    "favorites",
    JSON.stringify(favorites)
  );

  render();

}


/* ===== 页面显示 ===== */

function render(){

  const content =
    document.getElementById("content");

  const available =
    availableData();

  document.querySelectorAll(".tabs button")
    .forEach(x=>x.classList.remove("active"));


  if(mode==="today"){

    todayBtn.classList.add("active");

    const latest =
      available[available.length-1];

    if(latest){

      content.innerHTML = card(latest);

    }else{

      content.innerHTML =
        `<div class="card">
          今日素材将在北京时间 22:00 解锁。
        </div>`;

    }

  }


  if(mode==="history"){

    historyBtn.classList.add("active");

    content.innerHTML =
      [...available]
      .reverse()
      .map(card)
      .join("");

  }


  if(mode==="favorites"){

    favBtn.classList.add("active");

    const list =
      available.filter(
        x=>favorites.includes(x.date)
      );

    content.innerHTML =
      list.length
      ? list.reverse().map(card).join("")
      : `<div class="card">暂时没有收藏。</div>`;

  }


  if(mode==="search"){

    searchBtn.classList.add("active");

    content.innerHTML = `
      <input
        id="searchInput"
        placeholder="搜索人物、作品、名言、论点…"
      >
      <div id="results"></div>
    `;

    searchInput.oninput = function(){

      const q =
        this.value.trim().toLowerCase();

      const result =
        available.filter(d=>
          JSON.stringify(d)
          .toLowerCase()
          .includes(q)
        );

      results.innerHTML =
        q
        ? result.map(card).join("")
        : "";

    };

  }


  document.getElementById("status")
    .textContent =
      `已解锁 ${available.length} 页 · 每日 22:00 更新`;

}


/* ===== 标签 ===== */

todayBtn.onclick=()=>{
  mode="today";
  render();
};

historyBtn.onclick=()=>{
  mode="history";
  render();
};

favBtn.onclick=()=>{
  mode="favorites";
  render();
};

searchBtn.onclick=()=>{
  mode="search";
  render();
};


/* ===== 获取 data.json ===== */

async function load(){

  try{

    const response =
      await fetch(
        "./data.json?ts="+Date.now(),
        {cache:"no-store"}
      );

    const json =
      await response.json();

    DATA =
      Array.isArray(json)
      ? json
      : (json.materials || []);

    DATA.sort(
      (a,b)=>a.date.localeCompare(b.date)
    );

    render();

  }catch(e){

    document.getElementById("content")
      .innerHTML =
      `<div class="card">
        素材库读取失败，请稍后刷新。
      </div>`;

    document.getElementById("status")
      .textContent="连接失败";

  }

}

load();


/* ===== PWA ===== */

if("serviceWorker" in navigator){

  navigator.serviceWorker.register("./sw.js");

}

</script>

</body>
</html>
