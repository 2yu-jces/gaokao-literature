<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f2e7"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png"><title>高考文学素材每日积累</title>
<style>body{margin:0;background:#f7f2e7;color:#303730;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:760px;margin:auto;padding:24px 18px 90px}h1{font-family:Georgia,"Songti SC",serif;font-size:27px;margin:0}.sub,.status{color:#77786f;margin-top:7px}.status{font-size:12px}.tabs{display:flex;gap:8px;padding:16px 0;position:sticky;top:0;background:#f7f2e7}.tab{border:1px solid #ddd4c3;background:#fffdf8;border-radius:999px;padding:9px 13px}.tab.on{background:#303730;color:white}.search{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd4c3;border-radius:12px;font-size:16px}.card{background:#fffdf8;border:1px solid #ddd4c3;border-radius:18px;padding:22px;margin:16px 0}.day{color:#a78852;font-weight:bold}.fav{float:right;border:0;background:none;font-size:20px}.quote{font-family:Georgia,"Songti SC",serif;font-size:23px;line-height:1.6;margin:14px 0}.meta{color:#77786f;border-bottom:1px solid #ddd4c3;padding-bottom:14px}.text{line-height:1.85}.empty{text-align:center;color:#77786f;padding:50px}</style></head>
<body><main class="app"><h1>高考文学素材每日积累</h1><div class="sub">每日一页 · 少而精 · 为议论文真正积累</div><div id="status" class="status">正在读取素材库…</div><nav class="tabs"><button class="tab on" data-mode="today">今日</button><button class="tab" data-mode="all">历史</button><button class="tab" data-mode="fav">收藏</button><button class="tab" data-mode="search">搜索</button></nav><div id="searchBox" hidden><input id="q" class="search" placeholder="搜索名言、作者、名著、论点…"></div><section id="view"></section></main>
<script>
let DATA=[],fav=JSON.parse(localStorage.getItem('fav')||'[]'),mode='today';
const view=document.getElementById('view'),statusEl=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(x,i){let f=fav.includes(x.date);return `<article class="card"><div class="day">${esc(x.date||('第 '+(i+1)+' 页'))}<button class="fav" onclick="toggleFav('${esc(x.date)}')">${f?'★':'☆'}</button></div><div class="quote">“${esc(x.quote)}”</div><div class="meta">${esc(x.author)} · ${esc(x.source)}</div><h3>人物 / 名著素材</h3><div class="text">${esc(x.material)}</div><h3>核心论点</h3><div class="text">${esc(x.argument)}</div><h3>议论文运用示例</h3><div class="text">${esc(x.example)}</div></article>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));document.getElementById('searchBox').hidden=mode!=='search';let a=[...DATA];if(mode==='today')a=a.length?[a[a.length-1]]:[];if(mode==='fav')a=a.filter(x=>fav.includes(x.date));if(mode==='search'){let q=document.getElementById('q').value.trim().toLowerCase();a=q?a.filter(x=>JSON.stringify(x).toLowerCase().includes(q)):[]}view.innerHTML=a.length?a.map(card).join(''):`<div class="empty">${mode==='search'?'输入关键词开始搜索':'这里还没有素材'}</div>`}
function toggleFav(d){fav=fav.includes(d)?fav.filter(x=>x!==d):[...fav,d];localStorage.setItem('fav',JSON.stringify(fav));render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.getElementById('q').oninput=render;
async function load(){try{let r=await fetch('./data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let j=await r.json();DATA=Array.isArray(j)?j:(j.materials||[]);statusEl.textContent='素材库已连接 · 共 '+DATA.length+' 页'}catch(e){statusEl.textContent='素材库读取失败，请刷新后重试'}render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});load();
</script></body></html>
