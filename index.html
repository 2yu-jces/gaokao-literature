<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#303730"><link rel="manifest" href="manifest.json"><title>高考文学素材每日积累</title><style>
:root{--paper:#f7f2e7;--ink:#303730;--muted:#77786f;--line:#ddd4c3;--card:#fffdf8;--gold:#a78852}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif SC","Songti SC",serif}.app{max-width:820px;margin:auto;min-height:100vh;padding:22px 18px 90px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.install{border:1px solid var(--ink);background:transparent;border-radius:99px;padding:8px 12px;color:var(--ink)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tab{white-space:nowrap;border:0;background:#eae2d4;padding:8px 13px;border-radius:99px}.tab.on{background:var(--ink);color:white}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px #54452b0b;margin-bottom:14px}.day{font-size:12px;color:var(--gold);letter-spacing:.12em}.quote{font-size:24px;line-height:1.65;margin:14px 0}.source{color:var(--muted);font-size:13px}.section{margin-top:24px}.section h2{font-size:15px;margin:0 0 8px}.section p{line-height:1.9;margin:0}.actions{display:flex;gap:8px;margin-top:18px}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:white;font-size:15px;margin-bottom:12px}.listitem{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}.empty{text-align:center;color:var(--muted);padding:50px 10px}.tip{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}@media(min-width:700px){.app{padding-top:40px}.quote{font-size:30px}.card{padding:30px}}
</style></head><body><main class="app"><header><div><h1>高考文学素材每日积累</h1><div class="sub">每日一页 · 读一点，记一点，用得出来</div></div><button id="install" class="install" hidden>安装</button></header><nav class="tabs"><button class="tab on" data-v="today">今日</button><button class="tab" data-v="history">历史</button><button class="tab" data-v="fav">收藏</button><button class="tab" data-v="search">搜索</button></nav><section id="view"></section></main><script>
const DATA=[
{d:'第 1 页',q:'人的一切都应该是美丽的：面貌、衣裳、心灵、思想。',a:'安东·契诃夫',s:'《叔叔万尼亚》',m:'契诃夫以医生与作家的双重身份观察普通人的困境。他的作品很少制造宏大的英雄，却反复追问：人在庸常、压抑甚至失望的生活中，是否仍能保持尊严、善意与清醒。真正值得书写的，并非外在光鲜，而是人在现实压力下仍不放弃精神上的自我要求。',p:'真正的成长，不只是获得更漂亮的履历，更是让内心配得上自己的选择。契诃夫说，人的面貌、衣裳、心灵和思想都应该是美丽的。这里的“美”并非装饰，而是一种人格的完整：当现实使人疲惫时，仍不以冷漠回应世界；当利益诱惑出现时，仍愿意守住原则。一个人的高度，最终不是由掌声决定，而由无人注视时他仍坚持什么决定。'},
{d:'第 2 页',q:'一个人可以被毁灭，但不能被打败。',a:'欧内斯特·海明威',s:'《老人与海》',m:'老渔夫圣地亚哥连续八十四天没有捕到鱼，第八十五天独自出海，与巨大的马林鱼搏斗数日。返航途中，鲨鱼不断啃食他的战利品，最后只剩鱼骨。物质结果近乎失败，但他的意志并未因此屈服。',p:'结果固然重要，却不是衡量人的唯一尺度。圣地亚哥带回的只是一副鱼骨，但海明威没有把他写成失败者，因为真正决定人的不是一次得失，而是在不可控的命运面前是否仍选择行动。所谓“不能被打败”，并非保证成功，而是拒绝让失败替自己定义人格。'},
{d:'第 3 页',q:'世界上只有一种真正的英雄主义，就是认清生活的真相后依然热爱生活。',a:'罗曼·罗兰',s:'《米开朗琪罗传》相关表述',m:'罗曼·罗兰笔下的英雄并非没有痛苦的人。贝多芬、米开朗琪罗、托尔斯泰都经历过孤独、矛盾和现实重压。英雄主义的价值，正在于看见生活并不完美之后，仍主动承担、创造和热爱。',p:'未经现实检验的热爱容易成为幻想，经历现实之后仍保有热爱，才接近罗曼·罗兰所说的英雄主义。成熟并不是越来越冷漠，而是知道道路艰难之后仍愿意走下去。真正坚韧的人，不需要假装世界完美；他只是拒绝因为世界不完美，就放弃自己的责任与热望。'},
{d:'第 4 页',q:'路漫漫其修远兮，吾将上下而求索。',a:'屈原',s:'《离骚》',m:'屈原身处政治理想与现实冲突之中，遭受排挤与放逐，却始终没有停止对理想政治与人格价值的追求。《离骚》中的“求索”不是轻松的探索，而是在漫长、曲折甚至孤独的道路上保持主动选择。',p:'真正有价值的追求往往没有捷径。“路漫漫其修远兮”，承认道路漫长，并不意味着悲观；紧随其后的“吾将上下而求索”，恰恰说明人的价值存在于持续行动之中。面对尚无答案的问题，比急于证明自己更重要的，是保留求索的能力。'},
{d:'第 5 页',q:'其实地上本没有路，走的人多了，也便成了路。',a:'鲁迅',s:'《故乡》',m:'《故乡》结尾，鲁迅把“希望”比作路。希望不是等待来的确定结果，而是在行动中逐渐形成的可能。它既拒绝空想，也拒绝因为现实困难就断言未来没有改变的空间。',p:'希望最有力量的地方，不在于它保证未来，而在于它促使人开始行动。鲁迅说地上本没有路，走的人多了，也便成了路。许多改变最初都没有现成答案：先行者面对的往往只是荒地。真正的勇气，是在没有地图的时候仍迈出第一步，并用行动把可能变成道路。'}];
let fav=JSON.parse(localStorage.getItem('fav')||'[]'), current=DATA.length-1; const view=document.querySelector('#view');
function card(i){let x=DATA[i],is=fav.includes(i);return `<article class="card"><div class="day">${x.d}</div><div class="quote">“${x.q}”</div><div class="source">${x.a} · ${x.s}</div><div class="section"><h2>人物 / 名著素材</h2><p>${x.m}</p></div><div class="section"><h2>议论文运用示例</h2><p>${x.p}</p></div><div class="actions"><button class="btn" onclick="toggleFav(${i})">${is?'★ 已收藏':'☆ 收藏'}</button></div></article>`}
function render(mode='today'){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===mode));if(mode==='today')view.innerHTML=card(current)+`<div class="tip">提示：本版可离线阅读。每天新增的素材需要更新数据后重新打开页面。</div>`;if(mode==='history')view.innerHTML=DATA.map((x,i)=>`<div class="listitem" onclick="current=${i};render('today')"><b>${x.d}</b><br><span class="source">${x.q}</span></div>`).reverse().join('');if(mode==='fav')view.innerHTML=fav.length?fav.map(i=>card(i)).join(''):'<div class="empty">还没有收藏素材</div>';if(mode==='search')view.innerHTML=`<input class="search" id="q" placeholder="搜索名言、作者、人物、关键词…" oninput="doSearch(this.value)"><div id="results"></div>`}
function toggleFav(i){fav=fav.includes(i)?fav.filter(x=>x!==i):[...fav,i];localStorage.setItem('fav',JSON.stringify(fav));render(document.querySelector('.tab.on').dataset.v)}function doSearch(q){q=q.trim().toLowerCase();document.querySelector('#results').innerHTML=!q?'':DATA.map((x,i)=>({x,i})).filter(o=>Object.values(o.x).join(' ').toLowerCase().includes(q)).map(o=>`<div class="listitem" onclick="current=${o.i};render('today')"><b>${o.x.d} · ${o.x.a}</b><br><span class="source">${o.x.q}</span></div>`).join('')||'<div class="empty">没有找到</div>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.v));render();
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.querySelector('#install').hidden=false});document.querySelector('#install').onclick=async()=>{if(deferred){deferred.prompt();deferred=null;document.querySelector('#install').hidden=true}else alert('iPhone：Safari 分享 → 添加到主屏幕；电脑/安卓：浏览器菜单 → 安装应用/添加到主屏幕。')};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
